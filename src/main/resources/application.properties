spring.application.name=lacaleta
spring.config.import=optional:file:Caleta_Guillermo/lacaleta/.env[.properties],optional:file:.env[.properties]

# Puerto dinámico compatible con Render ($PORT) y local (8082)
server.port=${PORT:8082}

# Respetar encabezados de proxy inverso para despliegue en la nube (Render, Nginx, SSL)
server.forward-headers-strategy=framework

# Compresión HTTP (GZIP) para acelerar transferencia de HTML, CSS, JS y JSON
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# Caché HTTP en navegador para optimizar la velocidad de carga de recursos estáticos
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true

# CONFIGURACIÓN NEON / POSTGRESQL
spring.datasource.url=${DATABASE_URL:${DB_URL:}}
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME:}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Optimización HikariCP para conexiones Neon Postgres
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=900000

# JPA / HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Configuración de Correo SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
